<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #071525, #102d4b, #071525);
    color: #fff;
}

.container {
    width: 100%;
    max-width: 410px;
    text-align: center;
    padding: 35px 25px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    background: rgba(255,255,255,0.06);
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    backdrop-filter: blur(12px);
}

.telegram-icon {
    width: 85px;
    height: 85px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 42px;
    background: #229ED9;
    box-shadow: 0 0 30px rgba(34,158,217,0.35);
}

h1 {
    font-size: 29px;
    line-height: 1.3;
    margin-bottom: 12px;
}

h1 span {
    color: #38bdf8;
}

.description {
    font-size: 15px;
    color: #c4d3e2;
    line-height: 1.7;
    margin-bottom: 28px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.btn {
    width: 100%;
    padding: 17px 12px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    display: block;
    transition: 0.3s;
    animation: zoom 1.5s infinite ease-in-out;
}

.btn-free {
    background:#088817;
    color: #fff;
    box-shadow: 0 6px 22px rgba(34,158,217,0.3);
}

.btn-vip {
    background: #f7c948;
    color: #172033;
    box-shadow: 0 6px 22px rgba(247,201,72,0.2);
    animation-delay: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
    animation-play-state: paused;
}

@keyframes zoom {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.04);
    }
}

.note {
    margin-top: 25px;
    font-size: 12px;
    color: #a8bacd;
    line-height: 1.6;
}

@media (max-width: 480px) {
    .container {
        padding: 30px 20px;
    }

    h1 {
        font-size: 25px;
    }

    .description {
        font-size: 14px;
    }

    .btn {
        padding: 16px 10px;
        font-size: 15px;
    }
}

img {
	width: 85px;
}
</style>
</head>

<body>

<div class="container">

    <div><img src="logo.png" alt=""></div>

    <h1>Join Our <span>whatsapp</span> Community</h1>

    <p class="description">
        Get the latest updates, useful insights and
        exclusive community content. Join us today!
    </p>

    <div class="buttons">

        <a href="https://wa.me/919109375753"
           class="btn btn-free"
           target="_blank"
           rel="noopener noreferrer">
            JOIN  WHATSAPP
        </a>

        <a href="https://wa.me/919109375753"
           class="btn btn-vip"
           target="_blank"
           rel="noopener noreferrer">
            ★ JOIN VIP TELEGRAM
        </a>

    </div>

    <p class="note">
        Join our community to stay updated.<br>
        Please review all information carefully.
    </p>

</div>

</body>
</html>
